<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>סד"כ בית הערבה</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.summary{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    padding:15px;
    border-radius:10px;
    color:white;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.green{
    background:#2e7d32;
}

.red{
    background:#d32f2f;
}

.gray{
    background:#616161;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
}

th{
    background:#1976d2;
    color:white;
}

</style>

</head>

<body>

<h1>סד"כ כיתת הכוננות - בית הערבה</h1>

<div class="summary">

<div class="card green">
🟢 <span id="available">0</span>
</div>

<div class="card red">
🔴 <span id="unavailable">0</span>
</div>

<div class="card gray">
⚪ <span id="unknown">0</span>
</div>

</div>

<table>

<thead>
<tr>
<th>שם</th>
<th>תפקיד</th>
<th>סטטוס</th>
<th>עדכון אחרון</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<script>

async function loadData(){

const res =
await fetch("/api/status");

const data =
await res.json();

   data.sort((a, b) => {

  const firstA =
    a.name.split(" ")[0];

  const firstB =
    b.name.split(" ")[0];

  return firstA.localeCompare(
    firstB,
    "he"
  );

});
let available = 0;
let unavailable = 0;
let unknown = 0;

let html = "";

data.forEach(member=>{

let statusText = "";

if(member.status==="available"){
statusText="🟢 זמין";
available++;
}

else if(member.status==="unavailable"){
statusText="🔴 לא זמין";
unavailable++;
}

else{
statusText="⚪ לא ידוע";
unknown++;
}

html += `
<tr>

<td>${member.name}</td>

<td>
<select onchange="updateRole('${member.token}',this.value)">

<option value="">בחר</option>

<option value="מככ"
${member.role==="מככ"?"selected":""}>
מכ"כ
</option>

<option value="סמככ"
${member.role==="סמככ"?"selected":""}>
סמכ"כ
</option>

<option value="רבשץ"
${member.role==="רבשץ"?"selected":""}>
רבש"ץ
</option>

<option value="סגן רבשץ"
${member.role==="סגן רבשץ"?"selected":""}>
סגן רבש"ץ
</option>

<option value="חובש"
${member.role==="חובש"?"selected":""}>
חובש
</option>

<option value="לוחם"
${member.role==="לוחם"?"selected":""}>
לוחם
</option>
<option value="רחפן"
${member.role==="רחפן"?"selected":""}>
רחפן
</option>
</select>
</td>

<td>${statusText}</td>

<td>${
member.updated
? new Date(member.updated).toLocaleString("he-IL")
: "-"
}</td>

</tr>
`;

});

document.getElementById("available")
.innerText = available;

document.getElementById("unavailable")
.innerText = unavailable;

document.getElementById("unknown")
.innerText = unknown;

document.getElementById("tableBody")
.innerHTML = html;

}
async function updateRole(token, role){

  await fetch("/api/update-role",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token,
      role
    })
  });

  loadData();

}
loadData();

setInterval(loadData,5000);

</script>

</body>
</html>
