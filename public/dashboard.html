<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>סד"כ בית הערבה</title>
    <style>

.icon-btn{
    width:40px;
    height:34px;
    padding:6px;
    margin:2px;
    background:#f3f3f3;
    border:1px solid #999;
    border-radius:6px;
    cursor:pointer;
    transition:all .2s;
}

.icon-btn:hover{
    background:#e3f2fd;
    border-color:#1976d2;
}

.icon-btn svg{
    width:18px;
    height:18px;
    vertical-align:middle;
}

body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.summary{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    padding:15px;
    border-radius:10px;
    color:white;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.green{
    background:#2e7d32;
}

.red{
    background:#d32f2f;
}

.gray{
    background:#616161;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
}

th{
    background:#1976d2;
    color:white;
}

</style>

</head>

<body style="display:none;">
<h1>סד"כ כיתת הכוננות - בית הערבה</h1>
<button onclick="logout()">
🚪 יציאה
</button>
<div class="summary">

<div class="card green">
🟢 <span id="available">0</span>
</div>

<div class="card red">
🔴 <span id="unavailable">0</span>
</div>

<div class="card gray">
⚪ <span id="unknown">0</span>
</div>

</div>

<div style="margin-bottom:20px;display:flex;gap:10px;">

<button onclick="addMember()">

➕ הוסף חבר

</button>
<button onclick="whatsappAll()">

📢 וואטסאפ לכולם

</button>
<button onclick="showAvailableNow()">
🟢 מי זמין עכשיו
</button>
    <button onclick="showAvailableMap()">
🗺️ מפת זמינים
</button>
    <button onclick="exportMembers()">
💾 גיבוי JSON
</button>
    <button onclick="toggleAdminTestMode()">
🧪 מצב בדיקה
</button>

<input
id="searchBox"
type="text"
placeholder="חפש חבר..."
onkeyup="loadData()"
style="
flex:1;
padding:10px;
font-size:16px;
">

</div>

<table>

<thead>
<tr>
<th>שם</th>
<th>תפקיד</th>
<th>סטטוס</th>
<th>עדכון אחרון</th>
<th>קישור</th>
<th>טלפון</th>
<th>מפה</th>
<th>פעולות</th>
    
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>
<div
id="mapContainer"
style="
display:none;
margin-top:20px;
height:500px;
border:1px solid #ccc;
border-radius:10px;
overflow:hidden;
">
</div>
<script>
const isAdmin =
  localStorage.getItem("admin");
let adminTestMode =
  localStorage.getItem("adminTestMode") === "true";
if (isAdmin !== "true") {

  const password =
    prompt("הכנס סיסמת מנהל");

  fetch("/api/admin-login", {
    method: "POST",
    headers: {
      "Content-Type":
        "application/json"
    },
    body: JSON.stringify({
      password
    })
  })
  .then(res => {
    if (!res.ok) {
      throw new Error();
    }

    localStorage.setItem(
      "admin",
      "true"
    );

    document.body.style.display =
      "block";

    loadData();
})
  .catch(() => {

    alert("סיסמה שגויה");

    window.location.href =
      "/";

  });

}
async function loadData(){

const res =
await fetch("/api/status");

const data =
await res.json();
const search = (
  document.getElementById(
    "searchBox"
  )?.value || ""
).trim();
   data.sort((a, b) => {

  const firstA =
    a.name.split(" ")[0];

  const firstB =
    b.name.split(" ")[0];

  return firstA.localeCompare(
    firstB,
    "he"
  );

});
let available = 0;
let unavailable = 0;
let unknown = 0;

let html = "";

data.forEach(member=>{

if(
  search &&
  !member.name.includes(search)
){
  return;
}


let statusText = "";

if(member.status==="available"){
statusText="🟢 זמין";
available++;
}

else if(member.status==="unavailable"){
statusText="🔴 לא זמין";
unavailable++;
}

else{
statusText="⚪ לא ידוע";
unknown++;
}

const rowColor =
member.status==="available"
? "#e8f5e9"
: member.status==="unavailable"
? "#ffebee"
: "#f5f5f5";
const roleColor =
member.role==="רבשץ" ? "#ff9800" :
member.role==="סגן רבשץ" ? "#ffb74d" :
member.role==="מככ" ? "#2196f3" :
member.role==="סמככ" ? "#64b5f6" :
member.role==="חובש" ? "#4caf50" :
member.role==="רחפן" ? "#9c27b0" :
"#757575";
    
html += `
<tr style="background:${rowColor}">

<td>${member.name}</td>

<td>
<select
style="background:${roleColor};color:white;font-weight:bold;"
onchange="updateRole('${member.token}',this.value)">

<option value="">בחר</option>

<option value="מככ"
${member.role==="מככ"?"selected":""}>
מכ"כ
</option>

<option value="סמככ"
${member.role==="סמככ"?"selected":""}>
סמכ"כ
</option>

<option value="רבשץ"
${member.role==="רבשץ"?"selected":""}>
רבש"ץ
</option>

<option value="סגן רבשץ"
${member.role==="סגן רבשץ"?"selected":""}>
סגן רבש"ץ
</option>

<option value="חובש"
${member.role==="חובש"?"selected":""}>
חובש
</option>

<option value="לוחם"
${member.role==="לוחם"?"selected":""}>
לוחם
</option>
<option value="רחפן"
${member.role==="רחפן"?"selected":""}>
רחפן
</option>
</select>
</td>

<td>${statusText}</td>

<td>${
member.updated
? new Date(member.updated).toLocaleString("he-IL")
: "-"
}</td>
<td>
<button
onclick="copyLink('${member.token}')">
📋 העתק
</button>
</td>
<td>
${member.phone || "-"}
<br>

<button
class="icon-btn"
title="עריכת טלפון"
onclick="updatePhone('${member.token}','${member.phone || ""}')">

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24"
width="18"
height="18"
fill="#1976d2">

<path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.07 21 3 13.93 3 5c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>

</svg>

</button>

${member.phone ? `
<br>
<button
class="icon-btn"
title="שליחת WhatsApp"
onclick="openWhatsApp('${member.phone}','${member.token}')">

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 32 32"
width="18"
height="18"
fill="#25D366">

<path d="M16 3C8.82 3 3 8.82 3 16c0 2.6.77 5.02 2.08 7.05L3 29l6.15-2.01A12.95 12.95 0 0 0 16 29c7.18 0 13-5.82 13-13S23.18 3 16 3zm0 23c-2.17 0-4.2-.63-5.91-1.72l-.42-.27-3.65 1.19 1.2-3.56-.28-.45A9.9 9.9 0 0 1 6 16c0-5.52 4.48-10 10-10s10 4.48 10 10-4.48 10-10 10zm5.47-7.2c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15s-.77.97-.94 1.17c-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.08 4.48.71.31 1.27.5 1.7.64.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.08-.13-.28-.2-.58-.35z"/>

</svg>

</button>
` : ""}

</td><td>
${
  member.lat && member.lng
  ? `
<button
class="icon-btn"
title="פתיחת מיקום"
onclick="window.open('https://www.google.com/maps?q=${member.lat},${member.lng}','_blank')">

<svg
xmlns="http://www.w3.org/2000/svg"
width="18"
height="18"
viewBox="0 0 24 24"
fill="#1976d2"
style="vertical-align:middle;">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
</svg>

</button>
`
  : '-'
}
</td>

<td>

<button
class="icon-btn"
title="עריכת שם"
"onclick="editMember('${member.token}','${member.name}')">

<svg
xmlns="http://www.w3.org/2000/svg"
width="18"
height="18"
viewBox="0 0 24 24"
fill="#1976d2">
<path d="M3 17.25V21h3.75L17.81 6.94l-3.75-3.75L3 17.25zm18-11.5a1.003 1.003 0 000-1.42l-1.34-1.34a1.003 1.003 0 00-1.42 0l-1.05 1.05 2.75 2.75L21 5.75z"/>
</svg>

</button>

<button
class="icon-btn"
title="מחיקת חבר"
onclick="deleteMember('${member.token}','${member.name}')">

<svg
xmlns="http://www.w3.org/2000/svg"
width="18"
height="18"
viewBox="0 0 24 24"
fill="#1976d2">
<path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zm3-9h2v7H9zm4 0h2v7h-2zM15.5 4l-1-1h-5l-1 1H5v2h14V4z"/>
</svg>

</button>

</td>
</tr>
`;

});

document.getElementById("available")
.innerText = available;

document.getElementById("unavailable")
.innerText = unavailable;

document.getElementById("unknown")
.innerText = unknown;

document.getElementById("tableBody")
.innerHTML = html;

}
async function updateRole(token, role){

  await fetch("/api/update-role",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      token,
      role
    })
  });

  loadData();

}
    async function updatePhone(token, currentPhone){

  const phone =
    prompt(
      "הכנס מספר טלפון",
      currentPhone
    );

  if (phone === null) {
    return;
  }

  await fetch("/api/update-phone", {
    method: "POST",
    headers: {
      "Content-Type":
        "application/json"
    },
    body: JSON.stringify({
      token,
      phone
    })
  });

  loadData();

}
   function openWhatsApp(phone, token){

  const cleanPhone =
    phone.replace(/\D/g, "");

  const whatsappPhone =
    cleanPhone.startsWith("0")
      ? "972" + cleanPhone.substring(1)
      : cleanPhone;

  const link =
    window.location.origin +
    "/?token=" +
    token;

  const message =
    encodeURIComponent(
      "שלום,\nזה הקישור האישי שלך למערכת:\n" +
      link
    );

  window.open(
`https://api.whatsapp.com/send?phone=${whatsappPhone}&text=${message}`,
    "_blank"
  );

}
    async function whatsappAll(){

  const res =
    await fetch("/api/status");

  const data =
    await res.json();

  const phones =
    data
      .filter(m => m.phone)
      .map(m =>
        m.phone.replace(/\D/g, "")
      );

  if (!phones.length) {
    alert("לא נמצאו מספרי טלפון");
    return;
  }

  navigator.clipboard.writeText(
  phones.join(",")
);

alert(
  "הועתקו " +
  phones.length +
  " מספרים ללוח"
);

}
async function showAvailableNow(){

  const res =
    await fetch("/api/status");

  const data =
    await res.json();

  const availableMembers =
    data.filter(
      m => m.status === "available"
    );

  if (!availableMembers.length) {

    alert("אין חברים זמינים כרגע");

    return;
  }

  const list =
    availableMembers
      .map(m => m.name)
      .join("\n");

  navigator.clipboard.writeText(
    list
  );

  alert(
    "הועתקה רשימת הזמינים ללוח\n\n" +
    list
  );

}
function showAvailableMap(){

  const mapDiv =
    document.getElementById("mapContainer");

  mapDiv.style.display = "block";

  fetch("/api/status")
    .then(res => res.json())
    .then(data => {

      const availableMembers =
        data.filter(
          m =>
            m.status === "available" &&
            m.lat &&
            m.lng
        );

      if (!availableMembers.length) {

        mapDiv.innerHTML =
          "<h3>אין חברים זמינים עם מיקום</h3>";

        return;
      }

      let html =
        "<h3>🗺️ מפת זמינים</h3>";

      availableMembers.forEach(member => {

        html += `
          <div style="
            padding:10px;
            margin:5px 0;
            border:1px solid #ccc;
            border-radius:8px;
          ">
            🟢 ${member.name}
            <br>
            <a href="https://www.google.com/maps?q=${member.lat},${member.lng}" target="_blank">
              📍 פתח במפה
            </a>
          </div>
        `;

      });

      mapDiv.innerHTML = html;

    });

}   
   
    async function editMember(token, currentName){

  const name =
    prompt(
      "הכנס שם חדש",
      currentName
    );

  if (!name) {
    return;
  }

  const res =
    await fetch(
      "/api/update-name",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          token,
          name
        })
      }
    );

  const result =
    await res.json();

  if(result.success){
    loadData();
  }else{
    alert("שגיאה בעדכון השם");
  }

}
async function deleteMember(token, name){

  const ok =
    confirm(
      "למחוק את " +
      name +
      " ?"
    );

  if (!ok) {
    return;
  }

  const res =
    await fetch(
      "/api/delete-member",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          token
        })
      }
    );

  const result =
    await res.json();

  if (result.success) {
    loadData();
  } else {
    alert("שגיאה במחיקה");
  }

}
    async function exportMembers(){

  const res =
    await fetch("/api/status");

  const data =
    await res.json();

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "members-backup.json";

  a.click();

  URL.revokeObjectURL(
    url
  );

}
function toggleAdminTestMode(){

  adminTestMode = !adminTestMode;

  localStorage.setItem(
    "adminTestMode",
    adminTestMode
  );

  alert(
    adminTestMode
      ? "מצב בדיקה הופעל"
      : "מצב בדיקה בוטל"
  );

}
    function logout(){

  localStorage.removeItem("admin");

  location.reload();

}

function copyLink(token){

  const link =
    window.location.origin +
    "/?token=" +
    token;

  navigator.clipboard.writeText(link);

  alert("הקישור הועתק");

}
async function addMember() {
  const name =
    prompt("שם החבר החדש");

  if (!name) {
    return;
  }

  const res =
    await fetch(
      "/api/add-member",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          name
        })
      }
    );

  const result =
    await res.json();

  if (result.success) {
    loadData();
  } else {
    alert("שגיאה בהוספת חבר");
  }
}

if (isAdmin === "true") {

  document.body.style.display =
    "block";

  loadData();

}

setInterval(loadData,60000);
</script>

</body>
</html>
