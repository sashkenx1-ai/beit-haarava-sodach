<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>סד"כ בית הערבה</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    font-size:20px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>סד"כ כיתת הכוננות</h1>

<div id="loginBox">
    <input
        id="tokenInput"
        type="text"
        placeholder="הכנס קוד אישי"
        style="
            width:100%;
            padding:15px;
            font-size:18px;
            margin-top:20px;
            box-sizing:border-box;
        "
    >

    <button onclick="login()">
        התחבר
    </button>
</div>

<div id="mainApp" style="display:none;">
    <h2 id="memberName"></h2>

<button onclick="updateLocation()">
עדכן מיקום
</button>
<button
onclick="setStatus('available')"
style="background:#2e7d32;">

🟢 זמין

</button>

<button
onclick="setStatus('unavailable')"
style="background:#d32f2f;">

🔴 לא זמין

</button>

<div id="result"></div>
</div>
<script>

const params =
    new URLSearchParams(window.location.search);

let token =
    localStorage.getItem("token") ||
    params.get("token");
function login(){

    token =
        document.getElementById("tokenInput").value;

    localStorage.setItem(
        "token",
        token
    );

    loadMember();
}
async function loadMember(){

    if(!token){
        document.getElementById("loginBox").style.display =
            "block";

        document.getElementById("mainApp").style.display =
            "none";

        return;
    }

    const res =
        await fetch(`/api/me?token=${token}`);

    if(!res.ok){

        localStorage.removeItem("token");

        document.getElementById("memberName")
            .innerHTML =
            "קוד לא תקין";

        return;
    }

    const member =
        await res.json();

    document.getElementById("loginBox").style.display =
        "none";

    document.getElementById("mainApp").style.display =
        "block";

    document.getElementById("memberName")
        .innerHTML =
        member.name;
}

async function updateLocation(){

  document.getElementById("result").innerHTML =
    "מאתר מיקום...";

  navigator.geolocation.getCurrentPosition(

    async pos => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      const res = await fetch(
        "/api/update",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            token,
            lat,
            lng
          })
        }
      );

      const result = await res.json();

      document.getElementById("result").innerHTML =
        `✅ ${lat}, ${lng}<br>${
          result.available
            ? "🟢 זמין"
            : "🔴 לא זמין"
        }`;
    },

    err => {

      document.getElementById("result").innerHTML =
        "❌ " + err.message;

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}
async function setStatus(status){

    const res =
        await fetch(
            "/api/update-status",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    token,
                    status
                })
            }
        );

    const result =
        await res.json();

    document.getElementById("result")
        .innerHTML =
        status === "available"
        ? "🟢 זמין"
        : "🔴 לא זמין";
}
loadMember();

</script>

</body>

</html>
