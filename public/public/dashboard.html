<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>דשבורד סד"כ</title>
</head>
<body>

<h1>סד"כ בית הערבה</h1>

<div id="content">טוען...</div>

<script>
fetch('/api/status')
.then(r => r.json())
.then(data => {

let html = '';

data.forEach(member => {

html += `
<p>
${member.name}
-
${member.status}
</p>
`;

});

document.getElementById('content').innerHTML = html;

});
</script>

</body>
</html>
